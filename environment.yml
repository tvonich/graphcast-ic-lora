# Python environment for graphcast-ic-lora.
#
# Package versions are those of the tested environment (NCAR Derecho, NVIDIA A100 40 GB).
#
# CUDA: the pinned jaxlib (0.4.28+cuda12.cudnn89) is JAX's "local CUDA" build, which uses
# CUDA libraries installed outside pip. This environment provides cuDNN 8.9. The other
# CUDA 12 libraries (cuBLAS, cuFFT, cuSOLVER, cuSPARSE, nvJitLink, CUPTI) and the ptxas
# compiler must come from a CUDA 12 toolkit on the machine: its lib64 directory on
# LD_LIBRARY_PATH and its bin directory on PATH (on HPC systems, usually
# `module load cuda`). In the tested runs, cuDNN came from this environment and the rest
# from the system's CUDA 12.9.0. See https://jax.readthedocs.io/en/latest/installation.html
# for other ways to install JAX with CUDA.
#
# Do NOT install DeepMind's "graphcast" package into this environment: the modified
# copy in graphcast/ must be the one imported (submit_jobs/run_lora_only.sh puts it
# first on PYTHONPATH).
#
# Install:
#   conda env create -f environment.yml
#   conda activate graphcast-ic-lora

name: graphcast-ic-lora
channels:
  - conda-forge
dependencies:
  - python=3.10
  - cudnn=8.9
  - pip
  - pip:
    - --find-links https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
    - jax==0.4.28
    - jaxlib==0.4.28+cuda12.cudnn89
    - dm-haiku==0.0.11
    - optax==0.2.5
    - chex==0.1.89
    - jraph==0.0.6.dev0
    - dm-tree==0.1.8
    - trimesh==4.0.10
    - scipy==1.12.0
    - absl-py==2.1.0
    - typing_extensions==4.14.0
    - numpy==1.26.4
    - ml-dtypes==0.5.1
    - opt-einsum==3.3.0
    - python-dateutil==2.9.0.post0
    - xarray==2025.6.1
    - pandas==2.3.1
    - dask==2025.7.0
    - netCDF4==1.7.2
